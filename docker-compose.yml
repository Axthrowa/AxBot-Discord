# Botun ihtiyaç duyduğu servisler: PostgreSQL + Redis + SearXNG.
#
# Bot normalde Windows'ta exe olarak çalışır (bkz. "Botu Başlat.cmd"); bu servislere
# 127.0.0.1 üzerinden bağlanır. Portlar sadece bu bilgisayara açıktır, ağdan erişilemez.
#
#   docker compose up -d --wait        # servisleri başlat (Botu Başlat.cmd bunu kendisi yapar)
#   docker compose down                # servisleri durdur (veriler volume'larda kalır)
#
# Sunucuda (7/24) bot da Docker'da çalışır (exe ile AYNI ANDA çalıştırmayın; aynı token ile
# iki bot bağlanır):
#   docker compose --profile docker up -d --build
# Sunucuya kurulum için: deploy/ klasörü ve README.
#
# Ayarlar ve gizli bilgiler .env dosyasından okunur.

name: discord-bot

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bot:
    <<: *defaults
    # Sadece `--profile docker` ile başlar; varsayılan kurulumda bot exe olarak çalışır.
    profiles: ["docker"]
    build: .
    image: discord-bot:latest
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SEARXNG_URL: http://searxng:8080
      # Salt okunur dosya sistemi: loglar sadece `docker compose logs` ile (ve web panelinde).
      LOG_DIR: ""
      # Web paneli + itiraz formu: sadece Docker ağında dinler; dışarıya tünel servisi açar.
      WEB_BIND: 0.0.0.0:8080
      TUNNEL_METRICS_URL: http://tunnel:2000
      AXBOT_DOCKER: "1"
    # Bazı modem DNS'leri IPv6 (AAAA) sorgularını cevapsız bırakıp bağlantıları ~12 sn geciktiriyor.
    # Docker'ın iç DNS'i servis adlarını çözmeye devam eder, dış adlar için bunları kullanır.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    # docker stop → SIGTERM → bot shard'ları kapatır, XP'yi yazar, havuzu kapatır.
    stop_grace_period: 20s
    read_only: true
    # yt-dlp kendini /tmp altına açıp çalıştırır (exec gerekli); deno önbelleği de burada.
    tmpfs:
      - /tmp:size=256m,mode=1777,exec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m

  # Web paneli için Cloudflare hızlı tüneli: hesap ve port açmadan https://….trycloudflare.com adresi.
  # Adres tünel her yeniden başladığında değişebilir; bot yeni adresi kendisi öğrenir (/panel).
  tunnel:
    <<: *defaults
    profiles: ["docker"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://bot:8080
    dns:
      - 1.1.1.1
      - 8.8.8.8
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m

  postgres:
    <<: *defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER .env içinde tanımlı olmalı}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB .env içinde tanımlı olmalı}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *defaults
    image: redis:8-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD .env içinde tanımlı olmalı}
      - --appendonly
      - "yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    <<: *defaults
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET .env içinde tanımlı olmalı}
      SEARXNG_BASE_URL: http://searxng:8080/
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pg_data:
  redis_data:
