# Bot için yerel SearXNG ayarları. Gizli anahtar .env'deki SEARXNG_SECRET'tan gelir.
use_default_settings: true

general:
  instance_name: "discord-bot-search"

server:
  # Sadece bot (127.0.0.1) kullandığı için bot koruması/hız sınırı kapalı.
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 1
  autocomplete: ""
  # Bot JSON çıktısı ister; varsayılan olarak sadece html açıktır.
  formats:
    - html
    - json
